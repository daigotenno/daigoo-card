<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play DAIGOO!</title>

  <!-- Tells X to use the interactive player layout -->
  <meta name="twitter:card" content="player" />
  <meta name="twitter:title" content="Play DAIGOO!" />
  <meta name="twitter:description" content="Click to load and play DAIGOO right inside your feed!" />
  <meta name="twitter:player" content="https://itch.io" />
  <meta name="twitter:player:width" content="640" />
  <meta name="twitter:player:height" content="380" />
  <meta name="twitter:image" content="https://itch.zone" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #130000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Keeps the game fluid, perfectly scaled, and centered on all device displays */
    .game-wrapper {
      width: 100vw;
      height: 100vh;
      max-width: 640px;
      max-height: 380px;
      aspect-ratio: 640 / 380;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <iframe src="https://itch.io" allowfullscreen="">
      <a href="https://itch.io">Play DAIGOO on itch.io</a>
    </iframe>
  </div>

</body>
</html>
