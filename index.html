<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play DAIGOO!</title>

  <!-- Tells X to use the interactive player layout -->
  <meta name="twitter:card" content="player" />
  <meta name="twitter:title" content="Play DAIGOO!" />
  <meta name="twitter:description" content="Click to load and play DAIGOO right inside your feed!" />
  
  <!-- Points X directly to the official working game engine wrapper -->
  <meta name="twitter:player" content="https://itch.io" />
  <meta name="twitter:player:width" content="640" />
  <meta name="twitter:player:height" content="380" />
  <meta name="twitter:image" content="https://itch.zone" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #130000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .loading-box {
      max-width: 90%;
      padding: 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #ffb700;
      color: #130000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>

  <script>
    // FIXED: Bypasses frame blocks by instantly routing visitors cleanly to your game space
    window.location.replace("https://itch.io");
  </script>
</head>
<body>

  <div class="loading-box">
    <h2>Loading DAIGOO...</h2>
    <p>If the arena doesn't open automatically, tap below to open it directly:</p>
    <a class="btn" href="https://itch.io">PLAY NOW</a>
  </div>

</body>
</html>
