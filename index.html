<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play DAIGOO!</title>

  <!-- Tells X to use the interactive player layout -->
  <meta name="twitter:card" content="player" />
  <meta name="twitter:title" content="Play DAIGOO!" />
  <meta name="twitter:description" content="Click to load and play DAIGOO right inside your feed!" />
  
  <!-- The direct upload engine link -->
  <meta name="twitter:player" content="https://itch.io" />
  <meta name="twitter:player:width" content="640" />
  <meta name="twitter:player:height" content="380" />
  
  <!-- Your exact game cover artwork link -->
  <meta name="twitter:image" content="https://img.itch.zone/aW1nLzMwNDU5Nzg1LmpwZWc=/180x143%23c/h%2F4cRv.jpeg" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #130000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Creates a responsive window that dynamically scales down on mobile screens */
    .responsive-game-box {
      width: 100vw;
      height: 100vh;
      max-width: 640px;
      max-height: 380px;
      aspect-ratio: 640 / 380; /* Maintains 16:10 format proportions perfectly */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Wraps the game inside a fluid canvas container -->
  <div class="responsive-game-box">
    <iframe src="https://itch.io" allowfullscreen="">
      <a href="https://daigotenno.itch.io/daigoo">Play DAIGOO on itch.io</a>
    </iframe>
  </div>

</body>
</html>
